<svg viewBox="0 0 200 240" width="125" height="150" xmlns="http://www.w3.org/2000/svg">
    <style>
        @keyframes piscarOlho {
            0%, 90%, 100% { transform: scale(1); opacity: 1; }
            95% { transform: scaleY(0.1); opacity: 0.6; }
        }
        .olho-piscando {
            transform-origin: 65px 80px;
            animation: piscarOlho 3.5s infinite;
        }
    </style>
    <defs>
        <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#cbd5e1" />
        </linearGradient>
        <linearGradient id="detail-grad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#93c5fd" />
            <stop offset="100%" stop-color="#60a5fa" />
        </linearGradient>
    </defs>

    <!-- Antenas -->
    <line x1="45" y1="50" x2="25" y2="20" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <circle cx="23" cy="18" r="8" fill="url(#detail-grad)" />

    <line x1="155" y1="50" x2="175" y2="20" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" />
    <circle cx="177" cy="18" r="8" fill="url(#detail-grad)" />

    <!-- Fones Laterais -->
    <rect x="18" y="55" width="14" height="40" rx="7" fill="url(#detail-grad)" />
    <rect x="168" y="55" width="14" height="40" rx="7" fill="url(#detail-grad)" />

    <!-- Capacete -->
    <rect x="26" y="25" width="148" height="110" rx="46" fill="url(#body-grad)" stroke="#94a3b8" stroke-width="2" />

    <!-- Visor Preto -->
    <rect x="38" y="37" width="124" height="84" rx="34" fill="#090d16" stroke="#1e293b" stroke-width="2" />

    <!-- Olho Esquerdo (Piscando) -->
    <path class="olho-piscando" d="M 58 72 L 72 80 L 58 88" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#neon-glow)" />

    <!-- Olho Direito (Aberto) -->
    <ellipse cx="130" cy="78" rx="10" ry="14" fill="#38bdf8" filter="url(#neon-glow)" />

    <!-- Boca Sorridente -->
    <path d="M 85 96 Q 100 110 115 96" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" filter="url(#neon-glow)" />

    <!-- Pernas e Pés -->
    <rect x="72" y="195" width="20" height="25" rx="8" fill="url(#body-grad)" />
    <rect x="108" y="195" width="20" height="25" rx="8" fill="url(#body-grad)" />
    <ellipse cx="82" cy="224" rx="16" ry="8" fill="#94a3b8" />
    <ellipse cx="118" cy="224" rx="16" ry="8" fill="#94a3b8" />

    <!-- Tronco -->
    <path d="M 60 135 L 140 135 C 145 165, 135 198, 100 198 C 65 198, 55 165, 60 135 Z" fill="url(#body-grad)" stroke="#94a3b8" stroke-width="2" />
    <rect x="85" y="150" width="30" height="4" rx="2" fill="#38bdf8" filter="url(#neon-glow)" />

    <!-- Braços e Joinha -->
    <path d="M 138 142 Q 160 160 152 185" fill="none" stroke="url(#body-grad)" stroke-width="14" stroke-linecap="round" />
    <path d="M 62 142 Q 40 155 45 175" fill="none" stroke="url(#body-grad)" stroke-width="14" stroke-linecap="round" />
    <circle cx="48" cy="172" r="10" fill="url(#body-grad)" />
    <rect x="42" y="152" width="9" height="18" rx="4" fill="url(#body-grad)" stroke="#94a3b8" stroke-width="1.5" />
</svg>
