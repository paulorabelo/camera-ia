<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera Inteligente - Monitoramento Urbano</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 400px;
            background: #161f30;
            border: 1.5px solid #26354a;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 14px;
        }

        #webcam-container {
            width: 100%;
            height: 300px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
        }

        #webcam-container canvas {
            width: 100% !important;
            height: 100% !important;
            object-fit: cover;
        }

        #status {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            background: #1e293b;
            color: #94a3b8;
        }

        .alerta-lixo {
            background: rgba(239, 68, 68, 0.25) !important;
            color: #ef4444 !important;
            border: 1px solid #ef4444;
        }

        .alerta-limpo {
            background: rgba(34, 197, 94, 0.25) !important;
            color: #22c55e !important;
            border: 1px solid #22c55e;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>CÂMERA INTELIGENTE #01</h2>
        <p>Aponte a câmera traseira para o bueiro da maquete</p>

        <div id="webcam-container"></div>
        <div id="status">Carregando IA e Câmera...</div>
    </div>

    <script>
        const URL_MODELO = "https://teachablemachine.withgoogle.com/models/1ncfocFIL/";
        let model, webcam, maxPredictions;

        async function init() {
            const statusDiv = document.getElementById("status");
            try {
                const modelURL = URL_MODELO + "model.json";
                const metadataURL = URL_MODELO + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                maxPredictions = model.getTotalClasses();

                // flip = false (não espelha) e facingMode = environment (força câmera traseira)
                webcam = new tmImage.Webcam(320, 320, false);
                await webcam.setup({ facingMode: "environment" });
                await webcam.play();
                window.requestAnimationFrame(loop);

                document.getElementById("webcam-container").appendChild(webcam.canvas);
                statusDiv.innerText = "Monitorando bueiro...";
            } catch (e) {
                statusDiv.innerText = "Erro ao acessar câmera: " + e.name;
            }
        }

        async function loop() {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const prediction = await model.predict(webcam.canvas);
            const statusDiv = document.getElementById("status");
            let maiorProb = 0;
            let classe = "";

            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > maiorProb) {
                    maiorProb = prediction[i].probability;
                    classe = prediction[i].className;
                }
            }

            const pct = (maiorProb * 100).toFixed(0);
            if (classe.toLowerCase().includes("lixo") && maiorProb > 0.70) {
                statusDiv.className = "alerta-lixo";
                statusDiv.innerText = `🚨 LIXO DETECTADO (${pct}%)`;
            } else if (classe.toLowerCase().includes("limpo") && maiorProb > 0.70) {
                statusDiv.className = "alerta-limpo";
                statusDiv.innerText = `✅ BUEIRO LIMPO (${pct}%)`;
            } else {
                statusDiv.className = "";
                statusDiv.innerText = `${classe} (${pct}%)`;
            }
        }

        init();
    </script>
</body>

</html>
