<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera Inteligente - Monitoramento Urbano</title>
    <!-- Bibliotecas TensorFlow e Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <!-- Folha de Estilo Modular -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="card">
        <h2 id="titulo-camera">CÂMERA INTELIGENTE</h2>
        <p id="subtitulo-local">Aponte a câmera traseira para a maquete</p>

        <!-- Visor da Câmera -->
        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
            <div id="mira-box"></div>
        </div>

        <!-- Tela 1: Sucesso (Alerta Transmitido) -->
        <div id="tela-sucesso">
            <div class="balao-holografico">
                <div class="balao-tag">
                    <span>● ALERTA TRANSMITIDO</span>
                </div>
                <div class="balao-texto">
                    "Alerta enviado à Prefeitura com <strong>sucesso</strong>!"
                </div>
            </div>

            <div class="robo-container">
                <img src="assets/robo.svg" alt="Robô Agente IA" class="robo-svg">
            </div>

            <div id="contador-segundos" class="contador-trava">Próxima leitura liberada em 7s...</div>
            <button id="btn-nova-inspecao" class="btn-action" onclick="reiniciarInspecao()">
                INICIAR NOVA INSPEÇÃO
            </button>
        </div>

        <!-- Tela 2: Orientação Pedagógica (Opção 3 - Mascote Orientador) -->
        <div id="tela-orientacao">
            <div class="balao-holografico balao-alerta">
                <div class="balao-tag tag-alerta">
                    <span>⚠️ AGENTE DE SANEAMENTO INFORMA</span>
                </div>
                <div id="texto-orientacao" class="balao-texto">
                    "Câmera fora de posição! Aponte para o local correto."
                </div>
            </div>

            <div class="robo-container robo-alerta">
                <img src="assets/robo.svg" alt="Robô Orientador IA" class="robo-svg robo-filtro-ambar">
            </div>

            <button id="btn-entendido" class="btn-action" onclick="reiniciarInspecao()">
                ALINHAR A CÂMERA
            </button>
        </div>

        <div id="status">Toque no botão abaixo para ligar a câmera</div>

        <button id="btn-start" class="btn-action btn-start" onclick="iniciarSistema()">
            LIGAR CÂMERA DE INSPEÇÃO
        </button>

        <button id="btn-dispatch" class="btn-action btn-dispatch" onclick="dispararAlertaManual()">
            DISPARAR ALERTA MANUAL
        </button>
    </div>

    <!-- Scripts Modulares -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
