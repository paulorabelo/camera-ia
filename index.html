<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera Inteligente - Monitoramento Urbano</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #161f30;
            border: 1.5px solid #26354a;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.15rem;
            color: #38bdf8;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        #subtitulo-local {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 14px;
        }

        #video-container {
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #status {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            background: #1e293b;
            color: #94a3b8;
            transition: all 0.3s ease;
        }

        .alerta-lixo {
            background: rgba(239, 68, 68, 0.25) !important;
            color: #ef4444 !important;
            border: 1px solid #ef4444;
        }

        .alerta-limpo {
            background: rgba(34, 197, 94, 0.25) !important;
            color: #22c55e !important;
            border: 1px solid #22c55e;
        }

        .alerta-analisando {
            background: rgba(234, 179, 8, 0.2) !important;
            color: #eab308 !important;
            border: 1px solid #eab308;
        }

        .btn-action {
            margin-top: 12px;
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-start {
            background: #0284c7;
            color: #ffffff;
        }

        .btn-dispatch {
            background: #ef4444;
            color: #ffffff;
            display: none;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2 id="titulo-camera">CÂMERA INTELIGENTE</h2>
        <p id="subtitulo-local">Aponte a câmera traseira para a maquete</p>

        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div id="status">Toque no botão abaixo para ligar a câmera</div>

        <button id="btn-start" class="btn-action btn-start" onclick="iniciarSistema()">
            LIGAR CÂMERA DE INSPEÇÃO
        </button>

        <button id="btn-dispatch" class="btn-action btn-dispatch" onclick="dispararAlertaManual()">
            DISPARAR ALERTA MANUAL
        </button>
    </div>

    <script>
        // Se você retreinar adicionando a classe "Neutro", atualize este link:
        const URL_MODELO = "https://teachablemachine.withgoogle.com/models/1ncfocFIl/";

        // Link da Web App do Apps Script (terminado em /exec):
        const WEBHOOK_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyDIw2kWWaXTh7Od8t7KTk3BTUQxciv3rDUpJHp78zICILxY_tGdOs3VM4I8JZ16Dk6/exec";

        // Captura o local via URL (ex: ?local=Bueiro - Rua Yporã) ou usa o padrão
        const urlParams = new URLSearchParams(window.location.search);
        const LOCAL_MONITORADO = urlParams.get('local') || "Bueiro - Rua dos Cambucizeiros";

        let model, videoElement;
        let ultimoEnvio = 0;
        let classeAtual = "";

        // Controle de estabilização (Debounce)
        let tempoInicioDeteccaoLixo = 0;
        const TEMPO_MINIMO_ESTABILIZACAO_MS = 2000; // 2 segundos estáveis para disparar

        // Atualiza cabeçalho com o local
        document.getElementById("titulo-camera").innerText = LOCAL_MONITORADO;

        async function iniciarSistema() {
            const btn = document.getElementById("btn-start");
            const statusDiv = document.getElementById("status");
            videoElement = document.getElementById("webcam");

            btn.style.display = "none";
            statusDiv.innerText = "Solicitando permissão da câmera...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: false
                });

                videoElement.srcObject = stream;
                await videoElement.play();

                statusDiv.innerText = "Carregando modelo de IA...";
                const modelURL = URL_MODELO + "model.json";
                const metadataURL = URL_MODELO + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                statusDiv.innerText = "IA Pronta. Monitorando...";
                document.getElementById("btn-dispatch").style.display = "block";

                loopPredict();
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Erro: " + (err.message || err.name);
                btn.style.display = "block";
                btn.innerText = "TENTAR NOVAMENTE";
            }
        }

        async function loopPredict() {
            if (model && videoElement && videoElement.readyState === 4) {
                const prediction = await model.predict(videoElement);
                let maiorProb = 0;
                let melhorClasse = "";

                for (let i = 0; i < prediction.length; i++) {
                    if (prediction[i].probability > maiorProb) {
                        maiorProb = prediction[i].probability;
                        melhorClasse = prediction[i].className;
                    }
                }

                classeAtual = melhorClasse;
                const pct = (maiorProb * 100).toFixed(0);
                const statusDiv = document.getElementById("status");
                const agora = Date.now();

                // 1. FILTRO DE CLASSE NEUTRA
                if (melhorClasse.toLowerCase().includes("neutro") || melhorClasse.toLowerCase().includes("ambiente")) {
                    tempoInicioDeteccaoLixo = 0;
                    statusDiv.className = "";
                    statusDiv.innerText = `👀 Monitorando Ambiente (${pct}%)`;
                }
                // 2. DETECÇÃO DE LIXEIRA CHEIA
                else if (melhorClasse === "Lixeira Cheia" && maiorProb > 0.85) {
                    if (tempoInicioDeteccaoLixo === 0) tempoInicioDeteccaoLixo = agora;
                    let tempoDecorrido = agora - tempoInicioDeteccaoLixo;

                    if (tempoDecorrido >= TEMPO_MINIMO_ESTABILIZACAO_MS) {
                        statusDiv.className = "alerta-lixo";
                        statusDiv.innerText = `🚨 LIXEIRA CHEIA CONFIRMADA (${pct}%)`;

                        if (agora - ultimoEnvio > 20000) {
                            ultimoEnvio = agora;
                            enviarParaCentral(LOCAL_MONITORADO, "Lixeira Cheia");
                        }
                    } else {
                        statusDiv.className = "alerta-analisando";
                        statusDiv.innerText = `⚠️ Analisando resíduos na lixeira... (${pct}%)`;
                    }
                }
                // 3. DETECÇÃO DE LIXO NO BUEIRO
                else if (melhorClasse.toLowerCase().includes("lixo") && maiorProb > 0.85) {
                    if (tempoInicioDeteccaoLixo === 0) tempoInicioDeteccaoLixo = agora;
                    let tempoDecorrido = agora - tempoInicioDeteccaoLixo;

                    if (tempoDecorrido >= TEMPO_MINIMO_ESTABILIZACAO_MS) {
                        statusDiv.className = "alerta-lixo";
                        statusDiv.innerText = `🚨 LIXO NO BUEIRO CONFIRMADO (${pct}%)`;

                        if (agora - ultimoEnvio > 20000) {
                            ultimoEnvio = agora;
                            enviarParaCentral(LOCAL_MONITORADO, "Lixo no Bueiro");
                        }
                    } else {
                        statusDiv.className = "alerta-analisando";
                        statusDiv.innerText = `⚠️ Analisando resíduos no bueiro... (${pct}%)`;
                    }
                }
                // 4. ESTADOS LIMPOS
                else if (melhorClasse.toLowerCase().includes("limp") && maiorProb > 0.80) {
                    tempoInicioDeteccaoLixo = 0;
                    statusDiv.className = "alerta-limpo";
                    statusDiv.innerText = `✅ LOCAL LIMPO E REGULAR (${pct}%)`;
                }
            }
            requestAnimationFrame(loopPredict);
        }

        async function enviarParaCentral(local, ocorrencia) {
            const statusDiv = document.getElementById("status");
            statusDiv.innerText = "Enviando alerta para a Central...";

            try {
                await fetch(WEBHOOK_APPS_SCRIPT, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        local: local,
                        ocorrencia: ocorrencia
                    })
                });
                statusDiv.innerText = "🚨 OCORRÊNCIA REGISTRADA NA SALA DE SITUAÇÃO!";
                setTimeout(() => { tempoInicioDeteccaoLixo = 0; }, 3000);
            } catch (err) {
                console.error("Erro no envio:", err);
            }
        }

        function dispararAlertaManual() {
            if (!classeAtual || classeAtual.toLowerCase().includes("neutro")) {
                alert("Aponte a câmera para o bueiro ou lixeira antes de enviar um alerta!");
                return;
            }
            const ocorrenciaEnvio = classeAtual.includes("Lixeira") ? "Lixeira Cheia" : "Lixo no Bueiro";
            enviarParaCentral(LOCAL_MONITORADO, ocorrenciaEnvio);
        }
    </script>
</body>

</html>
