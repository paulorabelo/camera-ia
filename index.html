<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera Inteligente - Monitoramento Urbano</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #161f30;
            border: 1.5px solid #26354a;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 14px;
        }

        #video-container {
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #status {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            background: #1e293b;
            color: #94a3b8;
        }

        .alerta-lixo {
            background: rgba(239, 68, 68, 0.25) !important;
            color: #ef4444 !important;
            border: 1px solid #ef4444;
        }

        .alerta-limpo {
            background: rgba(34, 197, 94, 0.25) !important;
            color: #22c55e !important;
            border: 1px solid #22c55e;
        }

        .btn-start {
            margin-top: 14px;
            width: 100%;
            padding: 14px;
            background: #0284c7;
            color: #ffffff;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>CÂMERA INTELIGENTE #01</h2>
        <p>Aponte a câmera traseira para o bueiro da maquete</p>

        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div id="status">Toque no botão abaixo para ligar a câmera</div>

        <button id="btn-start" class="btn-start" onclick="iniciarSistema()">
            LIGAR CÂMERA DE INSPEÇÃO
        </button>
    </div>

    <script>
        const URL_MODELO = "https://teachablemachine.withgoogle.com/models/1ncfocFIL/";
        let model, videoElement;

        async function iniciarSistema() {
            const btn = document.getElementById("btn-start");
            const statusDiv = document.getElementById("status");
            videoElement = document.getElementById("webcam");

            btn.style.display = "none";
            statusDiv.innerText = "Solicitando permissão da câmera...";

            try {
                // Força câmera traseira com fallback automático
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: false
                });

                videoElement.srcObject = stream;
                await videoElement.play();

                statusDiv.innerText = "Carregando inteligência artificial...";
                const modelURL = URL_MODELO + "model.json";
                const metadataURL = URL_MODELO + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                statusDiv.innerText = "IA Pronta. Monitorando...";

                loopPredict();
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Erro: " + (err.message || err.name);
                btn.style.display = "block";
                btn.innerText = "TENTAR NOVAMENTE";
            }
        }

        async function loopPredict() {
            if (model && videoElement && videoElement.readyState === 4) {
                const prediction = await model.predict(videoElement);
                let maiorProb = 0;
                let melhorClasse = "";

                for (let i = 0; i < prediction.length; i++) {
                    if (prediction[i].probability > maiorProb) {
                        maiorProb = prediction[i].probability;
                        melhorClasse = prediction[i].className;
                    }
                }

                const pct = (maiorProb * 100).toFixed(0);
                const statusDiv = document.getElementById("status");

                if (melhorClasse.toLowerCase().includes("lixo") && maiorProb > 0.70) {
                    statusDiv.className = "alerta-lixo";
                    statusDiv.innerText = `🚨 LIXO DETECTADO (${pct}%)`;
                } else if (melhorClasse.toLowerCase().includes("limpo") && maiorProb > 0.70) {
                    statusDiv.className = "alerta-limpo";
                    statusDiv.innerText = `✅ BUEIRO LIMPO (${pct}%)`;
                } else {
                    statusDiv.className = "";
                    statusDiv.innerText = `${melhorClasse} (${pct}%)`;
                }
            }
            requestAnimationFrame(loopPredict);
        }
    </script>
</body>

</html>
