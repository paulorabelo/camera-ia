<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Câmera Inteligente - Monitoramento Urbano</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            text-align: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #161f30;
            border: 1.5px solid #26354a;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 1.2rem;
            color: #38bdf8;
            margin-bottom: 6px;
        }

        p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-bottom: 14px;
        }

        #video-container {
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #334155;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #status {
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            background: #1e293b;
            color: #94a3b8;
        }

        .alerta-lixo {
            background: rgba(239, 68, 68, 0.25) !important;
            color: #ef4444 !important;
            border: 1px solid #ef4444;
        }

        .alerta-limpo {
            background: rgba(34, 197, 94, 0.25) !important;
            color: #22c55e !important;
            border: 1px solid #22c55e;
        }

        .btn-action {
            margin-top: 12px;
            width: 100%;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-start {
            background: #0284c7;
            color: #ffffff;
        }

        .btn-dispatch {
            background: #ef4444;
            color: #ffffff;
            display: none;
        }

        .btn-dispatch:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>CÂMERA INTELIGENTE #01</h2>
        <p>Aponte a câmera traseira para o bueiro da maquete</p>

        <div id="video-container">
            <video id="webcam" autoplay playsinline muted></video>
        </div>

        <div id="status">Toque no botão abaixo para ligar a câmera</div>

        <button id="btn-start" class="btn-action btn-start" onclick="iniciarSistema()">
            LIGAR câmera DE INSPEÇÃO
        </button>

        <button id="btn-dispatch" class="btn-action btn-dispatch" onclick="dispararAlertaManual()">
            DISPARAR ALERTA MANUAL
        </button>
    </div>

    <script>
        // Link do modelo do Teachable Machine:
        const URL_MODELO = "https://teachablemachine.withgoogle.com/models/1ncfocFIl/";

        // Substitua pelo link de execução da sua Web App do Apps Script:
        const WEBHOOK_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbyDIw2kWWaXTh7Od8t7KTk3BTUQxciv3rDUpJHp78zICILxY_tGdOs3VM4I8JZ16Dk6/exec";

        let model, videoElement;
        let ultimoEnvio = 0;
        let classeAtual = "";

        async function iniciarSistema() {
            const btn = document.getElementById("btn-start");
            const statusDiv = document.getElementById("status");
            videoElement = document.getElementById("webcam");

            btn.style.display = "none";
            statusDiv.innerText = "A solicitar permissão da câmera...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { ideal: "environment" } },
                    audio: false
                });

                videoElement.srcObject = stream;
                await videoElement.play();

                statusDiv.innerText = "A carregar modelo de IA...";
                const modelURL = URL_MODELO + "model.json";
                const metadataURL = URL_MODELO + "metadata.json";

                model = await tmImage.load(modelURL, metadataURL);
                statusDiv.innerText = "IA Pronta. A monitorizar...";
                document.getElementById("btn-dispatch").style.display = "block";

                loopPredict();
            } catch (err) {
                console.error(err);
                statusDiv.innerText = "Erro: " + (err.message || err.name);
                btn.style.display = "block";
                btn.innerText = "TENTAR NOVAMENTE";
            }
        }

        async function loopPredict() {
            if (model && videoElement && videoElement.readyState === 4) {
                const prediction = await model.predict(videoElement);
                let maiorProb = 0;
                let melhorClasse = "";

                for (let i = 0; i < prediction.length; i++) {
                    if (prediction[i].probability > maiorProb) {
                        maiorProb = prediction[i].probability;
                        melhorClasse = prediction[i].className;
                    }
                }

                classeAtual = melhorClasse;
                const pct = (maiorProb * 100).toFixed(0);
                const statusDiv = document.getElementById("status");

                if (melhorClasse.toLowerCase().includes("lixo") && maiorProb > 0.80) {
                    statusDiv.className = "alerta-lixo";
                    statusDiv.innerText = `🚨 LIXO DETETADO (${pct}%)`;

                    // Disparo automático com intervalo de 20 segundos
                    const agora = Date.now();
                    if (agora - ultimoEnvio > 20000) {
                        ultimoEnvio = agora;
                        enviarParaCentral("Bueiro Rua das Flores", "Lixo no Bueiro");
                    }
                } else if (melhorClasse.toLowerCase().includes("limpo") && maiorProb > 0.70) {
                    statusDiv.className = "alerta-limpo";
                    statusDiv.innerText = `✅ BUEIRO LIMPO (${pct}%)`;
                } else {
                    statusDiv.className = "";
                    statusDiv.innerText = `${melhorClasse} (${pct}%)`;
                }
            }
            requestAnimationFrame(loopPredict);
        }

        async function enviarParaCentral(local, ocorrencia) {
            const statusDiv = document.getElementById("status");
            const textoAnterior = statusDiv.innerText;
            statusDiv.innerText = "A enviar alerta para a Central...";

            try {
                await fetch(WEBHOOK_APPS_SCRIPT, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        local: local,
                        ocorrencia: ocorrencia
                    })
                });
                statusDiv.innerText = "🚨 ALERTA REGISTADO NA CENTRAL!";
                setTimeout(() => { statusDiv.innerText = textoAnterior; }, 3000);
            } catch (err) {
                console.error("Erro no envio:", err);
            }
        }

        function dispararAlertaManual() {
            enviarParaCentral("Bueiro Rua das Flores", classeAtual || "Lixo no Bueiro");
        }
    </script>
</body>

</html>
